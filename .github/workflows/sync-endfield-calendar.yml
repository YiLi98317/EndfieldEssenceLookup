name: Sync Endfield calendar

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-endfield-calendar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-calendar.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-calendar.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps --only-shell chromium

      - name: Sync calendar
        run: python scripts/sync_calendar.py

      # Requires "Allow GitHub Actions to create and approve pull requests" in the repo's Actions settings.
      # Merging the PR pushes to main, which triggers deploy.yml.
      - name: Open or update calendar PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/sync-endfield-calendar
          base: main
          delete-branch: true
          add-paths: |
            public/images/version-calendar
            src/data/versionCalendars.json
          commit-message: "chore(calendar): add newly detected Endfield calendar"
          title: "chore(calendar): add newly detected Endfield calendar"
          body: |
            Automated update from the `Sync Endfield calendar` workflow.

            The calendar watcher detected new or revised calendar images on https://endfield.hypergryph.com/#calendar.
            Check the title, titleZh, and releaseDate in `src/data/versionCalendars.json` before merging.
